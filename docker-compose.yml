version: "3.9"

services:
  # -------------------------
  # FastAPI Backend
  # -------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile  # Root-level Dockerfile
    container_name: nlp_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - ENV=local
      - DEBUG=True
      - MCP_EMBEDDED=False
      - MCP_TAXONOMY_URL=http://taxonomy_server:7001
      - MCP_POLICY_URL=http://policy_server:7002
      - MCP_HISTORY_URL=http://history_server:7003
    depends_on:
      - taxonomy_server
      - policy_server
      - history_server

  # -------------------------
  # Streamlit Frontend
  # -------------------------
  frontend:
    image: python:3.11-slim
    container_name: nlp_frontend
    working_dir: /app
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - backend
    environment:
      - ENV=local

  # -------------------------
  # MCP Servers
  # -------------------------
  taxonomy_server:
    build:
      context: ./mcp_servers/taxonomy_server
    container_name: taxonomy_server
    command: python server.py
    ports:
      - "7001:7001"
    volumes:
      - ./mcp_servers/taxonomy_server/data:/app/data

  policy_server:
    build:
      context: ./mcp_servers/policy_server
    container_name: policy_server
    command: python server.py
    ports:
      - "7002:7002"
    volumes:
      - ./mcp_servers/policy_server/data:/app/data

  history_server:
    build:
      context: ./mcp_servers/history_server
    container_name: history_server
    command: python server.py
    ports:
      - "7003:7003"
    volumes:
      - ./mcp_servers/history_server/data:/app/data

# -------------------------
# Shared Volumes (optional)
# -------------------------
volumes:
  models:
  data:
  logs:
